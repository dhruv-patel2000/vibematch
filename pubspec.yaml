name: vibematch
description: "A new Flutter project for VibeMatch."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  flutter_webrtc: ^0.10.4
  socket_io_client: ^3.0.0
  in_app_purchase: ^3.1.18
  easy_localization: ^3.0.5
  google_mobile_ads: ^5.0.0
  dio: ^5.4.3
  cupertino_icons: ^1.0.6
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  video_player: ^2.8.6
  image_picker: ^1.1.2
  country_picker: ^2.0.27
  font_awesome_flutter: 10.7.0
  firebase_messaging: ^15.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  permission_handler: ^12.0.3
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/gateways/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
